<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Depuis combien de temps tu fais rien ?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    position: relative;
    cursor: none;
  }
  
  /* Étoiles scintillantes */
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }
  
  /* Formes géométriques flottantes */
  .shape {
    position: absolute;
    border: 2px solid;
    opacity: 0.3;
    animation: float 15s infinite linear;
  }
  
  @keyframes float {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(100vw, -100vh) rotate(720deg); }
  }
  
  /* Lignes de scan */
  .scanline {
    position: absolute;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #0ff, transparent);
    animation: scan 8s infinite;
    opacity: 0.3;
  }
  
  @keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
  }
  
  /* Conteneur principal */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }
  
  .title {
    font-size: 2rem;
    margin-bottom: 2rem;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    letter-spacing: 3px;
    animation: glow 2s infinite alternate;
  }
  
  @keyframes glow {
    from { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
    to { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff; }
  }
  
  .chrono {
    font-size: 6rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px #f0f, 0 0 40px #f0f;
    letter-spacing: 5px;
    padding: 2rem 4rem;
    border: 3px solid #f0f;
    border-radius: 20px;
    background: rgba(255, 0, 255, 0.1);
    box-shadow: 0 0 30px rgba(255, 0, 255, 0.5), inset 0 0 30px rgba(255, 0, 255, 0.2);
    position: relative;
    overflow: hidden;
  }
  
  .chrono::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 0, 255, 0.3), transparent);
    animation: shine 3s infinite;
  }
  
  @keyframes shine {
    0% { transform: translateX(-100%) translateY(-100%); }
    100% { transform: translateX(100%) translateY(100%); }
  }
  
  .status {
    margin-top: 2rem;
    font-size: 1.5rem;
    color: #0f0;
    text-shadow: 0 0 10px #0f0;
    letter-spacing: 2px;
  }
  
  .status.active {
    color: #f00;
    text-shadow: 0 0 10px #f00;
    animation: blink 0.5s infinite;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  
  /* Particules flottantes */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #0ff;
    border-radius: 50%;
    box-shadow: 0 0 10px #0ff;
    animation: particleFloat 10s infinite linear;
  }
  
  @keyframes particleFloat {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
  }
  
  /* Coins décoratifs */
  .corner {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 3px solid #0ff;
    opacity: 0.5;
  }
  
  .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
</style>
</head>
<body>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="scanline"></div>

<div class="container">
  <div class="title">⚠ DEPUIS COMBIEN DE TEMPS TU FAIS RIEN ? ⚠</div>
  <div class="chrono" id="chrono">00:00:00</div>
  <div class="status" id="status">✓ TU NE FAIS RIEN... CONTINUE COMME ÇA</div>
</div>

<script>
  // Création des étoiles
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.width = Math.random() * 3 + 'px';
    star.style.height = star.style.width;
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(star);
  }
  
  // Création des formes géométriques
  const colors = ['#0ff', '#f0f', '#ff0', '#0f0'];
  for (let i = 0; i < 15; i++) {
    const shape = document.createElement('div');
    shape.className = 'shape';
    const size = Math.random() * 100 + 50;
    shape.style.width = size + 'px';
    shape.style.height = size + 'px';
    shape.style.left = Math.random() * 100 + '%';
    shape.style.top = Math.random() * 100 + '%';
    shape.style.borderColor = colors[Math.floor(Math.random() * colors.length)];
    shape.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    shape.style.animationDuration = (Math.random() * 10 + 10) + 's';
    shape.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(shape);
  }
  
  // Création des particules
  for (let i = 0; i < 30; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
    particle.style.animationDelay = Math.random() * 10 + 's';
    document.body.appendChild(particle);
  }
  
  // Chronomètre
  let seconds = 0;
  let isPaused = false;
  let pauseTimeout;
  
  const chronoEl = document.getElementById('chrono');
  const statusEl = document.getElementById('status');
  
  function updateDisplay() {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    chronoEl.textContent = 
      String(hrs).padStart(2, '0') + ':' + 
      String(mins).padStart(2, '0') + ':' + 
      String(secs).padStart(2, '0');
  }
  
  function increment() {
    if (!isPaused) {
      seconds++;
      updateDisplay();
    }
  }
  
  setInterval(increment, 1000);
  
  function pauseChrono() {
    isPaused = true;
    statusEl.textContent = '⚠ ACTIVITÉ DÉTECTÉE ! CHRONO FIGÉ';
    statusEl.classList.add('active');
    
    clearTimeout(pauseTimeout);
    pauseTimeout = setTimeout(() => {
      isPaused = false;
      statusEl.textContent = '✓ TU NE FAIS RIEN... CONTINUE COMME ÇA';
      statusEl.classList.remove('active');
    }, 3000);
  }
  
  document.addEventListener('mousemove', pauseChrono);
  document.addEventListener('keydown', pauseChrono);
  document.addEventListener('click', pauseChrono);
  document.addEventListener('touchstart', pauseChrono);
  
  updateDisplay();
</script>

</body>
</html>
